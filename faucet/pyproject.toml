[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prisma-faucet"
version = "0.1.0"
description = "Prisma Chain test-token faucet policy service (B7-01) — test tokens have no monetary value"
requires-python = ">=3.10"
dependencies = ["cryptography>=41", "prisma-worker"]

# The HTTP service wrapper lands with Phase C deployment; the policy core is
# importable as prisma_faucet.

[tool.setuptools.packages.find]
where = ["."]
include = ["prisma_faucet*"]
