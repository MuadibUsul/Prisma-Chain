name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  chain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chain
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: chain/go.mod
          cache-dependency-path: chain/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/prismad

  vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go test -race ./vm
      - run: go vet ./...
      - run: go run ./cmd/prisma-vm -job examples/public-classifier.json -proof 3

  economics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tools -p 'test_*.py'

  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m pip install -e './network[test]'
      - run: python -m pytest -q network/tests

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m pip install -e './network[test]' -e ./worker
      - run: python -m pytest -q worker/tests
