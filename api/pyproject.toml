[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prisma-api"
version = "0.1.0"
description = "Prisma Chain Job API + scheduler (Phase B productization)"
requires-python = ">=3.10"
# prisma-network supplies the wire conventions; install from the repo:
#   pip install -e ./network -e ./api
dependencies = ["cryptography>=41", "prisma-network"]

[tool.setuptools.packages.find]
where = ["."]
include = ["prisma_api*"]
