syntax = "proto3";
package prisma.compute.v1;
option go_package = "prismachain/chain/x/compute/types";

service Query {
  rpc Task(QueryTaskRequest) returns (QueryTaskResponse);
  rpc Model(QueryModelRequest) returns (QueryModelResponse);
  rpc Worker(QueryWorkerRequest) returns (QueryWorkerResponse);
  rpc GEMMTask(QueryGEMMTaskRequest) returns (QueryGEMMTaskResponse);
  rpc GEMMDispute(QueryGEMMDisputeRequest) returns (QueryGEMMDisputeResponse);
  rpc GEMMReceipt(QueryGEMMReceiptRequest) returns (QueryGEMMReceiptResponse);
  rpc GEMMWorkerWork(QueryGEMMWorkerWorkRequest) returns (QueryGEMMWorkerWorkResponse);
  rpc GEMMDAStatus(QueryGEMMDAStatusRequest) returns (QueryGEMMDAStatusResponse);
  rpc DAProvider(QueryDAProviderRequest) returns (QueryDAProviderResponse);
}

message QueryTaskRequest { uint64 task_id = 1; }
message QueryTaskResponse { bytes task_json = 1; }
message QueryModelRequest { string model_id = 1; string spec_version = 2; }
message QueryModelResponse { bytes model_json = 1; }
message QueryWorkerRequest { string worker = 1; }
message QueryWorkerResponse {
  uint64 bonded_uprsm = 1;
  bytes network_public_key = 2;
  uint64 reserved_uprsm = 3;
}

message QueryGEMMTaskRequest { uint64 gemm_task_id = 1; }
message QueryGEMMTaskResponse { bytes task_json = 1; bytes dispute_json = 2; }

message QueryGEMMDisputeRequest { uint64 gemm_task_id = 1; }
message QueryGEMMDisputeResponse { bytes dispute_json = 1; }

message QueryGEMMReceiptRequest { bytes receipt_id = 1; }
message QueryGEMMReceiptResponse { bytes receipt_json = 1; }

message QueryGEMMWorkerWorkRequest { string worker = 1; }
message QueryGEMMWorkerWorkResponse { uint64 total_canonical_mac = 1; }

message QueryGEMMDAStatusRequest { uint64 gemm_task_id = 1; }
message QueryGEMMDAStatusResponse {
  uint32 required_replicas = 1;
  uint32 valid_replicas = 2;
  uint32 open_challenges = 3;
  string availability_status = 4;
  bytes attestations_json = 5;
}

message QueryDAProviderRequest { string provider = 1; }
message QueryDAProviderResponse { bytes provider_json = 1; }
