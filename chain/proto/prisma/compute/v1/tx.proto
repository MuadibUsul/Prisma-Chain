syntax = "proto3";
package prisma.compute.v1;
option go_package = "prismachain/chain/x/compute/types";

import "cosmos/msg/v1/msg.proto";

service Msg {
  option (cosmos.msg.v1.service) = true;
  rpc RegisterModel(MsgRegisterModel) returns (MsgRegisterModelResponse);
  rpc BondWorker(MsgBondWorker) returns (MsgBondWorkerResponse);
  rpc PostTask(MsgPostTask) returns (MsgPostTaskResponse);
  rpc AcceptTask(MsgAcceptTask) returns (MsgAcceptTaskResponse);
  rpc SubmitResult(MsgSubmitResult) returns (MsgSubmitResultResponse);
  rpc AttestResult(MsgAttestResult) returns (MsgAttestResultResponse);
  rpc StartChallenge(MsgStartChallenge) returns (MsgStartChallengeResponse);
  rpc ChallengeMidpoint(MsgChallengeMidpoint) returns (MsgChallengeMidpointResponse);
  rpc TimeoutChallenge(MsgTimeoutChallenge) returns (MsgTimeoutChallengeResponse);
  rpc FinalizeTask(MsgFinalizeTask) returns (MsgFinalizeTaskResponse);
  rpc RefundTask(MsgRefundTask) returns (MsgRefundTaskResponse);
  rpc PostGEMMTask(MsgPostGEMMTask) returns (MsgPostGEMMTaskResponse);
  rpc AcceptGEMMTask(MsgAcceptGEMMTask) returns (MsgAcceptGEMMTaskResponse);
  rpc SubmitGEMMResult(MsgSubmitGEMMResult) returns (MsgSubmitGEMMResultResponse);
  rpc AttestGEMMTask(MsgAttestGEMMTask) returns (MsgAttestGEMMTaskResponse);
  rpc OpenGEMMChallenge(MsgOpenGEMMChallenge) returns (MsgOpenGEMMChallengeResponse);
  rpc CommitGEMMTrace(MsgCommitGEMMTrace) returns (MsgCommitGEMMTraceResponse);
  rpc SubmitGEMMMidState(MsgSubmitGEMMMidState) returns (MsgSubmitGEMMMidStateResponse);
  rpc ArbitrateGEMM(MsgArbitrateGEMM) returns (MsgArbitrateGEMMResponse);
  rpc TimeoutGEMM(MsgTimeoutGEMM) returns (MsgTimeoutGEMMResponse);
  rpc FinalizeGEMM(MsgFinalizeGEMM) returns (MsgFinalizeGEMMResponse);
  rpc AbortGEMMTask(MsgAbortGEMMTask) returns (MsgAbortGEMMTaskResponse);
  rpc RegisterDAProvider(MsgRegisterDAProvider) returns (MsgRegisterDAProviderResponse);
  rpc SubmitDAAttestation(MsgSubmitDAAttestation) returns (MsgSubmitDAAttestationResponse);
  rpc OpenGEMMDAChallenge(MsgOpenGEMMDAChallenge) returns (MsgOpenGEMMDAChallengeResponse);
  rpc RespondGEMMDAChallenge(MsgRespondGEMMDAChallenge) returns (MsgRespondGEMMDAChallengeResponse);
  rpc TimeoutGEMMDAChallenge(MsgTimeoutGEMMDAChallenge) returns (MsgTimeoutGEMMDAChallengeResponse);
  rpc FailGEMMAvailability(MsgFailGEMMAvailability) returns (MsgFailGEMMAvailabilityResponse);
  rpc PostGraphTask(MsgPostGraphTask) returns (MsgPostGraphTaskResponse);
  rpc AcceptGraphTask(MsgAcceptGraphTask) returns (MsgAcceptGraphTaskResponse);
  rpc SubmitGraphResult(MsgSubmitGraphResult) returns (MsgSubmitGraphResultResponse);
  rpc SubmitGraphResultV2(MsgSubmitGraphResultV2) returns (MsgSubmitGraphResultV2Response);
  rpc OpenGraphChallenge(MsgOpenGraphChallenge) returns (MsgOpenGraphChallengeResponse);
  rpc GraphTrailClaim(MsgGraphTrailClaim) returns (MsgGraphTrailClaimResponse);
  rpc GraphMidPoint(MsgGraphMidPoint) returns (MsgGraphMidPointResponse);
  rpc ArbitrateGraphNode(MsgArbitrateGraphNode) returns (MsgArbitrateGraphNodeResponse);
  rpc FinalizeGraphTask(MsgFinalizeGraphTask) returns (MsgFinalizeGraphTaskResponse);
  rpc OpenWideGEMMDispute(MsgOpenWideGEMMDispute) returns (MsgOpenWideGEMMDisputeResponse);
  rpc WideTraceClaim(MsgWideTraceClaim) returns (MsgWideTraceClaimResponse);
  rpc WideMidPoint(MsgWideMidPoint) returns (MsgWideMidPointResponse);
  rpc ArbitrateWide512(MsgArbitrateWide512) returns (MsgArbitrateWide512Response);
  rpc SubmitGraphDAAttestation(MsgSubmitGraphDAAttestation) returns (MsgSubmitGraphDAAttestationResponse);
  rpc FailGraphAvailability(MsgFailGraphAvailability) returns (MsgFailGraphAvailabilityResponse);
  rpc OpenGraphDAChallenge(MsgOpenGraphDAChallenge) returns (MsgOpenGraphDAChallengeResponse);
  rpc RespondGraphDAChallenge(MsgRespondGraphDAChallenge) returns (MsgRespondGraphDAChallengeResponse);
  rpc TimeoutGraphDAChallenge(MsgTimeoutGraphDAChallenge) returns (MsgTimeoutGraphDAChallengeResponse);
}

message MsgRegisterModel {
  option (cosmos.msg.v1.signer) = "owner";
  string owner = 1;
  string model_id = 2;
  string spec_version = 3;
  string mode = 4;
  bytes image_digest = 5;
  bytes tokenizer_digest = 6;
  bytes weights_digest = 7;
  bytes program = 8;
}
message MsgRegisterModelResponse {}

message MsgBondWorker {
  option (cosmos.msg.v1.signer) = "worker";
  string worker = 1;
  uint64 amount = 2;
  bytes network_public_key = 3;
  // Ed25519 signature by network_public_key over the v1 account/chain binding.
  // Required whenever network_public_key is present; omit both for a top-up.
  bytes network_key_proof = 4;
}
message MsgBondWorkerResponse {}

message MsgPostTask {
  option (cosmos.msg.v1.signer) = "requester";
  string requester = 1;
  string mode = 2;
  string model_id = 3;
  string spec_version = 4;
  bytes input_commitment = 5;
  string data_ref = 6;
  uint64 max_fee = 7;
  uint64 deadline = 8;
  string privacy_tier = 9;
  repeated sint64 public_input = 10;
}
message MsgPostTaskResponse { uint64 task_id = 1; }

message MsgAcceptTask {
  option (cosmos.msg.v1.signer) = "worker";
  string worker = 1;
  uint64 task_id = 2;
}
message MsgAcceptTaskResponse {}

message MsgSubmitResult {
  option (cosmos.msg.v1.signer) = "worker";
  string worker = 1;
  uint64 task_id = 2;
  bytes output_digest = 3;
  bytes trace_root = 4;
  bytes receipt_digest = 5;
  uint64 output_tokens = 6;
  bytes trace_claim_json = 7;
  bytes receipt_json = 8;
}
message MsgSubmitResultResponse {}

message MsgAttestResult {
  option (cosmos.msg.v1.signer) = "monitor";
  string monitor = 1;
  uint64 task_id = 2;
}
message MsgAttestResultResponse {}

message MsgStartChallenge {
  option (cosmos.msg.v1.signer) = "challenger";
  string challenger = 1;
  uint64 task_id = 2;
  bytes trace_claim_json = 3;
}
message MsgStartChallengeResponse {}

message MsgChallengeMidpoint {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1;
  uint64 task_id = 2;
  bytes state_json = 3;
  bytes proof_json = 4;
}
message MsgChallengeMidpointResponse {}

message MsgTimeoutChallenge {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1;
  uint64 task_id = 2;
}
message MsgTimeoutChallengeResponse {}

message MsgFinalizeTask {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1;
  uint64 task_id = 2;
}
message MsgFinalizeTaskResponse {}

message MsgRefundTask {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1;
  uint64 task_id = 2;
}
message MsgRefundTaskResponse {}

// GEMM_INT8_V1 settlement path. The chain derives every canonical protocol
// value (task id, assignment id, canonical MAC count) through the
// prismachain/compute/gemmv1 library; clients never supply them.

message MsgPostGEMMTask {
  option (cosmos.msg.v1.signer) = "requester";
  string requester = 1;
  // 32-byte Ed25519 protocol key bound to the chain account by key proof.
  bytes requester_protocol_pubkey = 2;
  // Ed25519 signature over the v1 requester key binding.
  bytes requester_key_proof = 3;
  bytes requester_nonce = 4;
  uint64 m = 5;
  uint64 n = 6;
  uint64 k = 7;
  bytes matrix_a_root = 8;
  bytes matrix_b_root = 9;
  uint64 challenge_window = 10;
  uint64 max_price_per_cwu = 11;
  uint64 max_fee = 12;
  string input_data_ref = 13;
}
message MsgPostGEMMTaskResponse {
  uint64 gemm_task_id = 1;
  bytes protocol_task_id = 2;
}

message MsgAcceptGEMMTask {
  option (cosmos.msg.v1.signer) = "worker";
  string worker = 1;
  uint64 gemm_task_id = 2;
  bytes assignment_nonce = 3;
}
message MsgAcceptGEMMTaskResponse { bytes assignment_id = 1; }

message MsgSubmitGEMMResult {
  option (cosmos.msg.v1.signer) = "worker";
  string worker = 1;
  uint64 gemm_task_id = 2;
  bytes output_root = 3;
  string output_data_ref = 4;
  uint64 output_bytes = 5;
  uint64 completed_epoch = 6;
  // Ed25519 signature by the bonded worker network key over the canonical
  // gemmv1.ResultCommit rebuilt from these fields and chain state.
  bytes worker_signature = 7;
}
message MsgSubmitGEMMResultResponse { uint64 challenge_end = 1; }

message MsgAttestGEMMTask {
  option (cosmos.msg.v1.signer) = "monitor";
  string monitor = 1;
  uint64 gemm_task_id = 2;
}
message MsgAttestGEMMTaskResponse {}

message MsgOpenGEMMChallenge {
  option (cosmos.msg.v1.signer) = "challenger";
  string challenger = 1;
  uint64 gemm_task_id = 2;
  uint64 disputed_tile_i = 3;
  uint64 disputed_tile_j = 4;
  bytes worker_output_tile = 5;
  repeated bytes worker_proof_siblings = 6;
  uint32 worker_proof_index = 7;
  uint32 worker_proof_count = 8;
  bytes challenger_output_tile = 9;
  uint64 challenge_bond = 10;
  bytes challenger_signature = 11;
  // The challenger signs a fully deterministic object; the epoch it signs
  // must be supplied (the chain cannot guess it from the execution height).
  uint64 opened_epoch = 12;
}
message MsgOpenGEMMChallengeResponse { uint64 challenge_end = 1; }

message MsgCommitGEMMTrace {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1;
  uint64 gemm_task_id = 2;
  bytes trace_root = 3;
  bytes initial_state = 4;
  repeated bytes initial_proof_siblings = 5;
  uint32 initial_proof_index = 6;
  uint32 initial_proof_count = 7;
  bytes final_state = 8;
  repeated bytes final_proof_siblings = 9;
  uint32 final_proof_index = 10;
  uint32 final_proof_count = 11;
  uint64 locked_epoch = 12;
  bytes signature = 13;
}
message MsgCommitGEMMTraceResponse {}

message MsgSubmitGEMMMidState {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1;
  uint64 gemm_task_id = 2;
  bytes state = 3;
  repeated bytes proof_siblings = 4;
  uint32 proof_index = 5;
  uint32 proof_count = 6;
}
message MsgSubmitGEMMMidStateResponse {}

message MsgArbitrateGEMM {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1;
  uint64 gemm_task_id = 2;
  bytes a_tile = 3;
  bytes b_tile = 4;
  uint32 a_proof_tile_row = 5;
  uint32 a_proof_tile_col = 6;
  uint32 a_proof_tile_cols = 7;
  repeated bytes a_proof_siblings = 8;
  uint32 a_proof_count = 9;
  uint32 b_proof_tile_row = 10;
  uint32 b_proof_tile_col = 11;
  uint32 b_proof_tile_cols = 12;
  repeated bytes b_proof_siblings = 13;
  uint32 b_proof_count = 14;
}
message MsgArbitrateGEMMResponse { string outcome = 1; }

message MsgTimeoutGEMM {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1;
  uint64 gemm_task_id = 2;
}
message MsgTimeoutGEMMResponse { string outcome = 1; }

message MsgFinalizeGEMM {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1;
  uint64 gemm_task_id = 2;
}
message MsgFinalizeGEMMResponse { bytes receipt_id = 1; }

message MsgAbortGEMMTask {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1;
  uint64 gemm_task_id = 2;
}
message MsgAbortGEMMTaskResponse {}

// DA_REPLICA_V1: bonded providers, availability attestations and objective
// on-chain sampling challenges. The chain never performs network I/O: it
// verifies signatures, bounded bytes, Merkle proofs and block heights only.

message MsgRegisterDAProvider {
  option (cosmos.msg.v1.signer) = "provider";
  string provider = 1;
}
message MsgRegisterDAProviderResponse {}

message MsgSubmitDAAttestation {
  option (cosmos.msg.v1.signer) = "provider";
  string provider = 1;
  uint64 gemm_task_id = 2;
  // JSON rendering of the canonical gemmv1.DAAttestation object. The
  // signature always covers the canonical CBOR preimage; the chain
  // re-encodes the decoded object through the protocol helpers.
  bytes attestation_json = 3;
}
message MsgSubmitDAAttestationResponse {}

message MsgOpenGEMMDAChallenge {
  option (cosmos.msg.v1.signer) = "challenger";
  string challenger = 1;
  uint64 gemm_task_id = 2;
  string provider = 3;
  bytes nonce = 4;
  uint64 bond = 5;
}
message MsgOpenGEMMDAChallengeResponse {
  uint64 challenge_id = 1;
  uint32 tile_i = 2;
  uint32 tile_j = 3;
  uint64 deadline = 4;
}

message MsgRespondGEMMDAChallenge {
  option (cosmos.msg.v1.signer) = "provider";
  string provider = 1;
  uint64 challenge_id = 2;
  bytes tile = 3;
  repeated bytes proof_siblings = 4;
  uint32 proof_index = 5;
  uint32 proof_count = 6;
}
message MsgRespondGEMMDAChallengeResponse {}

message MsgTimeoutGEMMDAChallenge {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1;
  uint64 challenge_id = 2;
}
message MsgTimeoutGEMMDAChallengeResponse {}

message MsgFailGEMMAvailability {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1;
  uint64 gemm_task_id = 2;
}
message MsgFailGEMMAvailabilityResponse {}

// --- CANONICAL_GRAPH_V1 settlement ----------------------------------------
// Graph tasks reuse the GEMM settlement mechanics (escrow, worker bond,
// challenge window, persisted dispute, permissionless bounded arbitration,
// receipt) with their own storage namespace, statuses and gas schedule.

message MsgPostGraphTask {
  option (cosmos.msg.v1.signer) = "requester";
  string requester = 1;
  // 32-byte Ed25519 protocol key bound to the chain account by key proof.
  bytes requester_protocol_pubkey = 2;
  bytes requester_key_proof = 3;
  bytes requester_nonce = 4;
  // Canonical GraphDescriptor JSON (validated and hashed on chain).
  bytes graph_json = 5;
  string input_data_ref = 6;
  uint64 challenge_window = 7;
  uint64 max_price_per_cwu = 8;
  uint64 max_fee = 9;
}
message MsgPostGraphTaskResponse {
  uint64 graph_task_id = 1;
  bytes graph_id = 2;
}

message MsgAcceptGraphTask {
  option (cosmos.msg.v1.signer) = "worker";
  string worker = 1;
  uint64 graph_task_id = 2;
  bytes assignment_nonce = 3;
}
message MsgAcceptGraphTaskResponse { bytes assignment_ref = 1; }

message MsgSubmitGraphResult {
  option (cosmos.msg.v1.signer) = "worker";
  string worker = 1;
  uint64 graph_task_id = 2;
  repeated bytes output_roots = 3;
  bytes final_output_root = 4;
  uint64 completed_epoch = 5;
  // Ed25519 signature by the bonded worker network key over the canonical
  // GraphResultCommit rebuilt from these fields and chain state.
  bytes worker_signature = 6;
}
message MsgSubmitGraphResultResponse { uint64 challenge_end = 1; }

message MsgSubmitGraphResultV2 {
  option (cosmos.msg.v1.signer) = "worker";
  string worker = 1;
  uint64 graph_task_id = 2;
  // Compact commitment to every node's output TensorRoot (Phase F.1
  // manifest); locked before any verification randomness.
  bytes node_output_manifest_root = 3;
  repeated bytes output_roots = 4;
  bytes final_output_root = 5;
  uint64 completed_epoch = 6;
  bytes worker_signature = 7;
}
message MsgSubmitGraphResultV2Response { uint64 challenge_end = 1; }

message MsgOpenGraphChallenge {
  option (cosmos.msg.v1.signer) = "challenger";
  string challenger = 1;
  uint64 graph_task_id = 2;
  // The challenger's counter-claimed output roots; they must differ from
  // the committed final output root (false challenges are refused up
  // front) and are re-derived into the dispute record.
  repeated bytes challenger_output_roots = 3;
  uint64 challenge_bond = 4;
}
message MsgOpenGraphChallengeResponse { uint64 challenge_end = 1; }

message MsgGraphTrailClaim {
  option (cosmos.msg.v1.signer) = "party";
  string party = 1;
  uint64 graph_task_id = 2;
  bytes trail_root = 3;
  bytes initial_root = 4;
  repeated bytes initial_proof = 5;
  bytes final_root = 6;
  repeated bytes final_proof = 7;
}
message MsgGraphTrailClaimResponse {}

message MsgGraphMidPoint {
  option (cosmos.msg.v1.signer) = "party";
  string party = 1;
  uint64 graph_task_id = 2;
  bytes state_root = 3;
  repeated bytes proof_siblings = 4;
  uint64 epoch = 5;
}
message MsgGraphMidPointResponse {}

// One chunk of arbiter evidence: a tensor chunk (or every operand chunk
// for GEMM nodes) with its chunk proof and the tensor-leaf proof inside
// the committed input state tree.
message GraphChunkEvidence {
  uint32 ref_kind = 1;
  uint32 ref_index = 2;
  bytes desc_json = 3;
  bytes root = 4;
  uint32 chunk_index = 5;
  uint32 count = 6;
  bytes chunk = 7;
  repeated bytes proof = 8;
  repeated bytes state_proof = 9;
}

message MsgArbitrateGraphNode {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1;
  uint64 graph_task_id = 2;
  bytes worker_out_root = 3;
  uint32 worker_chunk_index = 4;
  bytes worker_chunk = 5;
  repeated bytes worker_chunk_proof = 6;
  bytes challenger_out_root = 7;
  uint32 challenger_chunk_index = 8;
  bytes challenger_chunk = 9;
  repeated bytes challenger_chunk_proof = 10;
  repeated GraphChunkEvidence evidence = 11;
  // Pinned RoPE sin/cos table (Q12.20 values) for ROPE nodes; verified
  // against the committed table input root before use.
  repeated int64 rope_table = 12;
}
message MsgArbitrateGraphNodeResponse { string outcome = 1; }

// --- WIDE_GEMM_DISPUTE_V1 (F.5C A2) -----------------------------------------
// A wide-GEMM dispute is opened only when the graph bisection localized the
// first divergent node to a GEMM_A13W10_I64_V1 node.  Every message binds
// the task, the node and the K-step geometry; the chain only ever performs
// bounded evidence checks plus one exact 512-MAC recomputation.

message MsgOpenWideGEMMDispute {
  option (cosmos.msg.v1.signer) = "challenger";
  string challenger = 1;
  uint64 graph_task_id = 2;
  uint32 node_id = 3;   // must equal the first divergent node
  uint32 tile_i = 4;
  uint32 tile_j = 5;
  uint64 challenge_bond = 6;
}
message MsgOpenWideGEMMDisputeResponse { uint64 deadline = 1; }

message MsgWideTraceClaim {
  option (cosmos.msg.v1.signer) = "party";
  string party = 1;
  uint64 graph_task_id = 2;
  // Merkle root over WideStateLeafV1(step) leaves of the party's partial
  // state chain (S0 = zero state .. S_steps).
  bytes trace_root = 3;
  // endpoint states: 64 x BE64 two's complement.
  bytes initial_state = 4;
  repeated bytes initial_proof = 5;
  bytes final_state = 6;
  repeated bytes final_proof = 7;
}
message MsgWideTraceClaimResponse {}

message MsgWideMidPoint {
  option (cosmos.msg.v1.signer) = "party";
  string party = 1;
  uint64 graph_task_id = 2;
  // state at the canonical midpoint step (64 x BE64) + inclusion proof.
  bytes state = 3;
  repeated bytes proof = 4;
  uint64 epoch = 5;
}
message MsgWideMidPointResponse {}

message MsgArbitrateWide512 {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1;
  uint64 graph_task_id = 2;
  // each party's claimed state after the disputed K-step (64 x BE64),
  // with an inclusion proof against its locked trace root.
  bytes worker_next_state = 3;
  repeated bytes worker_next_proof = 4;
  bytes challenger_next_state = 5;
  repeated bytes challenger_next_proof = 6;
  // operand evidence: 8 A-row chunks and 8 W-row chunks (GraphChunkEvidence),
  // each carrying the 64-element row window that contains the 8 K-columns
  // of this step; the chain extracts the 8x8 tiles from these chunks.
  repeated GraphChunkEvidence evidence = 7;
}
message MsgArbitrateWide512Response { string outcome = 1; }

// --- GRAPH_VERIFICATION_BUNDLE_V2 availability (F.5C A4) --------------------
// The DA layer proves STORAGE of the artifact the worker committed: typed
// GraphDAAttestationV2 objects plus objective chunk challenges.  Providers
// never execute the Transformer.

message MsgSubmitGraphDAAttestation {
  option (cosmos.msg.v1.signer) = "provider";
  string provider = 1;
  uint64 graph_task_id = 2;
  // canonical GraphDAAttestationV2 (CBOR preimage signed by the provider).
  bytes attestation_json = 3;
}
message MsgSubmitGraphDAAttestationResponse {}

message MsgFailGraphAvailability {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1;
  uint64 graph_task_id = 2;
}
message MsgFailGraphAvailabilityResponse {}

message MsgOpenGraphDAChallenge {
  option (cosmos.msg.v1.signer) = "challenger";
  string challenger = 1;
  uint64 graph_task_id = 2;
  string provider = 3;
  uint32 node_id = 4;
  uint32 chunk_index = 5;
  bytes nonce = 6;
  uint64 bond = 7;
}
message MsgOpenGraphDAChallengeResponse {
  uint64 challenge_id = 1;
  uint64 deadline = 2;
}

message MsgRespondGraphDAChallenge {
  option (cosmos.msg.v1.signer) = "provider";
  string provider = 1;
  uint64 challenge_id = 2;
  // the committed node descriptor (typed), its manifest inclusion proof
  // against the task's node-output manifest root, and the typed chunk with
  // its TensorRootV2 inclusion proof.
  bytes node_root = 9;
  bytes node_desc_json = 3;
  repeated bytes manifest_proof = 4;
  bytes chunk = 5;
  uint32 chunk_index = 6;
  uint32 chunk_count = 7;
  repeated bytes chunk_proof = 8;
}
message MsgRespondGraphDAChallengeResponse {}

message MsgTimeoutGraphDAChallenge {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1;
  uint64 challenge_id = 2;
}
message MsgTimeoutGraphDAChallengeResponse {}

message MsgFinalizeGraphTask {
  option (cosmos.msg.v1.signer) = "actor";
  string actor = 1;
  uint64 graph_task_id = 2;
}
message MsgFinalizeGraphTaskResponse { bytes receipt_id = 1; }
