[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prisma-network"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["cryptography>=41", "fastapi>=0.110", "httpx>=0.27", "pydantic>=2", "uvicorn>=0.29"]

[project.optional-dependencies]
test = ["pytest>=8"]
chain = ["grpcio>=1.60"]
model = ["tokenizers>=0.20,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["prisma_network*"]
